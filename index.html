<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supermercado - Início</title>

    <link rel="stylesheet" href="../style/index.css">
</head>
<body>

    <header class="cabecalho">

    <div class="logo">
        <h1>SuperMercado</h1>
    </div>

    <button class="botao-usuario" id="botaoUsuario">
        <span class="icone-usuario">👤</span>
        <span>Usuário</span>
    </button>

</header>


    <main class="conteudo">

        <section class="boas-vindas">
            <h2>Olá, cliente!</h2>
            <p>Confira suas compras realizadas.</p>
        </section>


        <section class="compras">

            <div class="titulo-compras">
                <h2>Minhas compras</h2>
            </div>

            <div id="listaCompras" class="lista-compras">

                <div class="compra">
                    <div>
                        <h3>Compra #001</h3>
                        <p>15/09/2026</p>
                    </div>

                    <div class="informacoes-compra">
                        <strong>R$ 125,90</strong>
                        <span class="status">Concluída</span>
                    </div>
                </div>


                <div class="compra">
                    <div>
                        <h3>Compra #002</h3>
                        <p>10/09/2026</p>
                    </div>

                    <div class="informacoes-compra">
                        <strong>R$ 87,50</strong>
                        <span class="status">Concluída</span>
                    </div>
                </div>

            </div>

        </section>

    </main>


    <script src="../js/index.js"></script>

</body>
</html>
