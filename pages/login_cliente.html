<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login do Cliente - Supermercado</title>

    <link rel="stylesheet" href="../style/login_cliente.css">
</head>

<body>

    <main class="login-container">

        <section class="login-card">

            <div class="logo">
                🛒
            </div>

            <h1>Supermercado</h1>

            <p class="subtitulo">
                Entre na sua conta
            </p>

            <form id="loginForm">

                <div class="campo">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Digite seu e-mail"
                        autocomplete="email"
                        required
                    >

                </div>

                <div class="campo">

                    <label for="senha">
                        Senha
                    </label>

                    <div class="senha-container">

                        <input
                            type="password"
                            id="senha"
                            name="senha"
                            placeholder="Digite sua senha"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            id="mostrarSenha"
                            class="mostrar-senha"
                            aria-label="Mostrar senha"
                        >
                            👁
                        </button>

                    </div>

                </div>

                <div id="mensagem" class="mensagem"></div>

                <button
                    type="submit"
                    class="btn-login"
                >
                    Entrar
                </button>

            </form>

            <div class="cadastro">

                <span>Ainda não possui uma conta?</span>

                <a href="#">
                    Criar conta
                </a>

            </div>

        </section>

    </main>

    <script src="../js/login_cliente.js"></script>

</body>

</html>
